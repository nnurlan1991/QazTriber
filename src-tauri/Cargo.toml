[package]
name = "qaztriber"
version = "1.4.0"
description = "QazTriber — локальная расшифровка совещаний"
authors = ["QazTriber"]
edition = "2021"
rust-version = "1.77"

[lib]
name = "qaztriber_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = ["devtools", "tray-icon"] }
tauri-plugin-opener = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1.53.0", features = ["rt", "time", "sync"] }
reqwest = { version = "0.13.3", default-features = false, features = ["blocking", "json", "rustls"] }
global-hotkey = "0.8.0"
cpal = "0.17.1"
hound = "3.5.1"
enigo = "0.3.0"
arboard = "3.6.1"

[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true

[target.'cfg(target_os = "macos")'.dependencies]
core-foundation = "0.10.1"
